server {
  bind_address = "0.0.0.0"
  bind_port    = "8081"
  trust_domain = "example.org"
  data_dir     = "/tmp/spire-data"
  log_level    = "DEBUG"
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/tmp/spire-data/datastore.sqlite3"
    }
  }

  NodeAttestor "join_token" {
    plugin_data {}
  }

  KeyManager "memory" {
    plugin_data {}
  }

  UpstreamAuthority "cagw" {
    plugin_cmd  = "/opt/spire/bin/spire-upstreamauthority-cagw"
    plugin_data {
      cagw_url       = "https://cagw.example.com/cagw"
      ca_id          = "my-partition~spire-ca-id"
      profile_id     = "basic-ca-subord"
      p12_password   = "${CAGW_P12_PASSWORD}"
      # server_ca_cert is expanded from CAGW_SERVER_CA_MODE at runtime:
      #   empty    -> the bind-mounted /opt/spire/conf/cagw-server-ca.pem (default)
      #   "system" -> verify CAGW against the host system root store (public cert)
      server_ca_cert = "${CAGW_SERVER_CA_MODE}"
      # p12_file       = "/opt/spire/conf/cagw-client.p12"
    }
  }
}
